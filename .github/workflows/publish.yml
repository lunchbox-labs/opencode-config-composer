name: Publish
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunchbox-labs-opencode-config-composer-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package and source
    if: >-
      github.repository == 'lunchbox-labs/opencode-config-composer' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      access: ${{ steps.release.outputs.access }}
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit already on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate release metadata
        id: release
        run: node scripts/validate-release.mjs
      - name: Install dependencies
        run: npm ci
      - name: Check source and installed package
        run: npm run check
      - name: Resolve and install a compatible OpenCode binary
        id: opencode
        run: node scripts/opencode.mjs install "$RUNNER_TEMP/opencode"
      - name: Test native OpenCode
        run: npm run test:native
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/opencode-linux-x64/bin/opencode
          OPENCODE_TEST_VERSION: ${{ steps.opencode.outputs.version }}
      - name: Pack the verified build
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          mkdir repeated-pack
          npm pack --ignore-scripts --pack-destination repeated-pack
          cmp release/*.tgz repeated-pack/*.tgz
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunchbox-labs-opencode-config-composer-release
          path: release/
          if-no-files-found: error
          retention-days: 3

  prepare:
    name: Prepare ${{ needs.verify.outputs.tag }}
    environment: release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LUNCHBOX_LABS_APP_CLIENT_ID }}
          private-key: ${{ secrets.LUNCHBOX_LABS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Prepare tag and draft release
        run: node scripts/release-lifecycle.mjs prepare
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          NPM_PACKAGE_NAME: ${{ needs.verify.outputs.name }}
          NPM_PACKAGE_VERSION: ${{ needs.verify.outputs.version }}

  publish:
    name: Publish npm ${{ needs.verify.outputs.tag }}
    needs: [verify, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lunchbox-labs-opencode-config-composer-release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use a trusted-publishing-capable npm version
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Verify release artifact checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish or verify npm package
        run: node scripts/release-lifecycle.mjs npm
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          NPM_PACKAGE_NAME: ${{ needs.verify.outputs.name }}
          NPM_PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
          NPM_ACCESS: ${{ needs.verify.outputs.access }}
          NPM_CONFIG_PROVENANCE: 'false'

  attach:
    environment: release
    name: Publish GitHub ${{ needs.verify.outputs.tag }}
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Use the workflow's helper even when manually targeting an older tag.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lunchbox-labs-opencode-config-composer-release
          path: release
      - name: Verify release artifact checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LUNCHBOX_LABS_APP_CLIENT_ID }}
          private-key: ${{ secrets.LUNCHBOX_LABS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Verify npm tarball and publish GitHub release
        run: node scripts/release-lifecycle.mjs finish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          NPM_PACKAGE_NAME: ${{ needs.verify.outputs.name }}
          NPM_PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
