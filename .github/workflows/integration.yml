name: Integration Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Preserve cancellation across the workflow's display-name change.
  group: Integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The pull request merge commit and both of its parents, so the diff against
          # the base branch needs no further fetch.
          fetch-depth: 2
      - name: Decide whether the changed files need the native suites
        id: scope
        env:
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.mjs
  native:
    name: Native integration (${{ matrix.os }}, ${{ matrix.suite }})
    needs: scope
    # Pushes to main always run every suite; a failed scope job skips nothing silently
    # because the workflow itself fails.
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [registration, core, examples, coexistence, profile, permissions, inspector, apply, terminal, cleanup]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
        timeout-minutes: 3
      - name: Save installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Test the installed package in native OpenCode
        run: npm run test:integration -- --suite ${{ matrix.suite }}
        timeout-minutes: 10
      - name: Upload compact failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.os }}-${{ matrix.suite }}-${{ github.run_attempt }}
          path: integration-results/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9
  minimum-registration:
    name: Npm loader (${{ matrix.os }}, OpenCode ${{ matrix.opencode }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        opencode: ['minimum']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Test terminal profile apply readiness clock
        run: npm exec --call 'node --experimental-strip-types --test tests/terminal-apply.test.ts'
      - run: npm run test:integration -- --suite registration
        env:
          OPENCODE_TEST_VERSION: ${{ matrix.opencode }}
