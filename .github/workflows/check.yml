name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: Check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        opencode: ['latest', 'minimum']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENCODE_TEST_VERSION: ${{ matrix.opencode }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate GitHub workflows
        shell: bash
        run: |
          actionlint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$actionlint_dir"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$actionlint_dir/actionlint_1.7.7_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt \
            -o "$actionlint_dir/checksums.txt"
          (cd "$actionlint_dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$actionlint_dir/actionlint_1.7.7_linux_amd64.tar.gz" -C "$actionlint_dir" actionlint
          "$actionlint_dir/actionlint" .github/workflows/*.yml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        id: node
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Identify the runner image
        id: image
        shell: bash
        # node-pty is compiled against the image's system libraries on Linux, so a cached
        # install must stay within one runner image generation.
        run: echo "os=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"
      - name: Restore installed dependencies
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          # node-pty compiles from source on Linux, so the finished install restores far
          # faster than npm's download cache plus a fresh npm ci.
          key: node-modules-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
      - name: Save installed dependencies
        # Save before the checks so a failing run still seeds the cache for the next one.
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - run: npm run check
      - name: Resolve and install a compatible OpenCode binary
        id: opencode
        run: node scripts/opencode.mjs install "$RUNNER_TEMP/opencode"
      - name: Test standalone TUI startup and the shipped workflow
        run: npm exec --call 'node --experimental-strip-types --test --test-concurrency=2 tests/config-composer-tui.native.ts tests/review-programming.native.ts'
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/opencode-linux-x64/bin/opencode
          OPENCODE_TEST_VERSION: ${{ steps.opencode.outputs.version }}
